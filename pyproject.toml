[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wg-handshake-overlay"
version = "0.2.0"
description = "Nonprivileged reference model for a split WireGuard handshake overlay"
requires-python = ">=3.11"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
